name: Plugin version

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check manifest versions
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/check_plugin_version.py "origin/${{ github.base_ref }}"
          else
            python3 scripts/check_plugin_version.py
          fi
